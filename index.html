<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>楚河漢界 · 3D 中國象棋</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem("xiangqi.theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <header class="menubar">
      <div class="menubar-brand">
        <h1>楚河漢界</h1>
        <p id="mode-label" class="mode-label">難度‧中等</p>
      </div>
      <p id="status" class="status">紅方 · 行棋</p>
      <nav class="menubar-actions">
        <button type="button" id="btn-new">新局</button>
        <button type="button" id="btn-undo">悔棋</button>
        <div class="style-wrap">
          <button type="button" id="btn-style" aria-expanded="false" aria-controls="style-menu">棋子樣式</button>
          <div id="style-menu" class="style-menu" hidden role="menu"></div>
        </div>
        <button type="button" id="btn-theme" aria-label="切換外觀">
          <svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12.1 2a9.9 9.9 0 0 0-1.1.06 10 10 0 1 0 11 11A9 9 0 0 1 12.1 2z"
            />
          </svg>
          <svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5a1 1 0 0 1 1 1v1.5a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 17a1 1 0 0 1 1 1V22a1 1 0 1 1-2 0v-1.5a1 1 0 0 1 1-1zM3 11a1 1 0 0 1 1-1h1.5a1 1 0 1 1 0 2H4a1 1 0 0 1-1-1zm15.5 0a1 1 0 0 1 1-1H21a1 1 0 1 1 0 2h-1.5a1 1 0 0 1-1-1zM5.64 5.64a1 1 0 0 1 1.41 0l1.06 1.06a1 1 0 1 1-1.41 1.41L5.64 7.05a1 1 0 0 1 0-1.41zm10.25 10.25a1 1 0 0 1 1.41 0l1.06 1.06a1 1 0 0 1-1.41 1.41l-1.06-1.06a1 1 0 0 1 0-1.41zM18.36 5.64a1 1 0 0 1 0 1.41l-1.06 1.06a1 1 0 1 1-1.41-1.41l1.06-1.06a1 1 0 0 1 1.41 0zM8.11 15.89a1 1 0 0 1 0 1.41L7.05 18.36a1 1 0 0 1-1.41-1.41l1.06-1.06a1 1 0 0 1 1.41 0z"
            />
          </svg>
        </button>
      </nav>
    </header>

    <div id="setup-modal" class="setup-modal" hidden>
      <div class="setup-dialog">
        <p class="setup-title">新局設置</p>
        <div id="setup-options" class="setup-options" role="radiogroup" aria-label="對局模式">
          <button type="button" data-mode="easy" aria-checked="false">難度‧簡單</button>
          <button type="button" data-mode="medium" aria-checked="true">難度‧中等</button>
          <button type="button" data-mode="hard" aria-checked="false">難度‧困難</button>
          <button type="button" data-mode="pvp" aria-checked="false">雙人對弈</button>
        </div>
        <button type="button" id="setup-start">開始對局</button>
      </div>
    </div>

    <div id="endgame" class="endgame" hidden>
      <p id="end-title" class="end-title"></p>
      <button type="button" id="btn-again">再下一局</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
